                           {%- endfor %})AS [SRC]
                            ON 
                           	{%- for col in columns if col.isBusinessKey -%}
                              {%- if not loop.first %}
                                AND
                              {%- endif %}
                                [SRC].[{{col.name}}]= [DIM].[{{col.name}}]
