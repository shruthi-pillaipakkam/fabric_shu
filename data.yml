defaultStorageMapping: TEST
installedPackages: {}
jobs: {}
locations:
  HEE:
    mappingDefinitions:
      "28":
        database: COALESCE_DEV
        schema: dbo
  TEST:
    mappingDefinitions:
      "28":
        database: COALESCE_DEV
        schema: shruthi_test
  TEST2:
    mappingDefinitions:
      "28":
        database: COALESCE_DEV_TESTING
        schema: dbo
macros: {}
stepTypes:
  StepType-14:
    id: "14"
    isDisabled: false
    metadata:
      defaultStorageLocation: null
      error: null
      nodeMetadataSpec: |

        capitalized: Copy of Stage
        short: STG
        plural: Stages
        tagColor: '#2EB67D'

        config:
        - groupName: Options
          items:
          - type: materializationSelector
            default: table
            options:
            - table
            - view
            isRequired: true

          - type: multisourceToggle
            enableIf: "{% if node.materializationType == 'table' %} true {% else %} false {% endif %}" 

          - type: overrideSQLToggle
            enableIf: "{% if node.materializationType == 'view' %} true {% else %} false {% endif %}"
            
          - displayName: Multi Source Strategy
            attributeName: insertStrategy
            type: dropdownSelector
            default: INSERT
            options:
            - "INSERT"
            - "UNION"
            - "UNION ALL"
            isRequired: true
            enableIf: "{% if node.isMultisource %} true {% else %} false {% endif %}"

          - displayName: Truncate Before
            attributeName: truncateBefore
            type: toggleButton
            default: true

          - displayName: Enable Tests
            attributeName: testsEnabled
            type: toggleButton
            default: true
            
          - displayName: Pre-SQL
            attributeName: preSQL
            type: textBox
            syntax: sql
            isRequired: false

          - displayName: Post-SQL
            attributeName: postSQL
            type: textBox
            syntax: sql
            isRequired: false
      templates:
        create:
          templateString: |-
            {% if node.override.create.enabled %}
            	
            	{{ node.override.create.script }}

            {% elif node.materializationType == 'table' %}
              {{ stage('Drop Stage Table') }}
              DROP TABLE IF EXISTS {{ ref_no_link(node.location.name, node.name) }}

            	{{ stage('Create Stage T

            	CREATE TABLE {{ ref_no_link(node.location.name, node.name) }}
            	(
            		{% for col in columns %}
            			[{{ col.name }}] {{ col.dataType }}
            			{%- if not col.nullable %} NOT NULL
            			{% endif %}
            			{%- if not loop.last -%}, {% endif %}
            		{% endfor %}
            	)


            {% elif node.materializationType == 'view' %}
                {{ stage('Drop Stage View') }}

                DROP VIEW IF EXISTS {{ ref_no_link(node.location.name, node.name) }}

                {{ stage('Create Stage View') }}

                CREATE VIEW {{ ref_no_link(node.location.name, node.name) }}
                (
                    {% for col in columns %}
                        [{{ col.name }}]
                        {%- if not loop.last -%}, {% endif %}
                    {% endfor %}
                )
                AS
                {% for source in sources %}
                    SELECT
                    {% for col in source.columns %}
                        {{ get_source_transform(col) }} AS [{{ col.name }}]
                        {%- if not loop.last -%}, {% endif %}
                    {% endfor %}

                    {{ source.join }}

                    {% if not loop.last %}
                        {% if config.insertStrategy in ['UNION', 'UNION ALL'] %}
                            {{ config.insertStrategy }}
                        {% else %}
                            UNION
                        {% endif %}
                    {% endif %}
                {% endfor %}

            {% endif %}
        run:
          templateString: |2-

                {% for test in node.tests if config.testsEnabled %}
                    {% if test.runOrder == 'Before' %}
                        {{ test_stage(test.name, test.continueOnFailure) }}
                        {{ test.templateString }}
                    {% endif %}
                {% endfor %}

            {% if node.materializationType == 'table' %}
            	{% if config.preSQL %}
            		{{ stage('Pre-SQL') }}
            		{{ config.preSQL }}
            	{% endif %}
            	
            	
            	
            		{% if config.truncateBefore %}
            	
            			{{ stage('Truncate Stage Table') }}
            			TRUNCATE TABLE {{ ref_no_link(node.location.name, node.name) }}
            	
            		{% endif %}
            	
            	
            		{% if config.insertStrategy in ['UNION', 'UNION ALL'] %}
            			{{ stage( config.insertStrategy + ' Sources' | string ) }}
            			INSERT INTO {{ ref_no_link(node.location.name, node.name) }}
            				(
            					{% for col in columns %}
            						[{{ col.name }}]
            						{%- if not loop.last -%},{% endif %}
            					{% endfor %}
            				)
            		{% endif %}
            	
            	
            		{% for source in sources %}
            	
            			{% if config.insertStrategy == 'INSERT' %}
            				{{ stage('Insert ' + source.name | string ) }}
            	
            				INSERT INTO {{ ref_no_link(node.location.name, node.name) }}
            				(
            					{% for col in source.columns %}
            						[{{ col.name }}]
            						{%- if not loop.last -%},{% endif %}
            					{% endfor %}
            				)
            			{% endif %}
            	
            			SELECT
            			{% for col in source.columns %}
                            {{ get_source_transform(col) }} AS [{{ col.name }}]
            				{%- if not loop.last -%}, {% endif %}
            			{% endfor %}
            	
            			{{ source.join }}
            	
            			{% if config.insertStrategy in ['UNION', 'UNION ALL'] and not loop.last %}
            				{{config.insertStrategy}}
            			{% endif %}
            	
            		{% endfor %}
            	
            	{% if config.postSQL %}
            		{{ stage('Post-SQL') }}
            		{{ config.postSQL }}
            	{% endif %}
            {% endif %}

            {% if config.testsEnabled %}
            	{% for test in node.tests %}
            		{% if test.runOrder == 'After' %}
            			{{ test_stage(test.name, test.continueOnFailure) }}
            			{{ test.templateString }}
                    {% endif %}
            	{% endfor %}

            	{% for column in columns %}
            		{% for test in column.tests %}
            			{{ test_stage(column.name + ": " + test.name) }}
            			{{ test.templateString }}
            		{% endfor %}
            	{% endfor %}
            {% endif %}
    name: Copy of Stage
    version: 1
  StepType-17:
    id: "17"
    isDisabled: false
    metadata:
      defaultStorageLocation: null
      error: null
      nodeMetadataSpec: |
        capitalized: Copy of Fact
        plural: Facts
        short: FCT
        tagColor: '#D9A438'

        config:
        - groupName: Options
          items:
          - type: materializationSelector
            isRequired: true
            options:
            - table
            - view

          - type: overrideSQLToggle
            enableIf: "{% if node.materializationType == 'view' %} true {% else %} false {% endif %}"

          - type: multisourceToggle
            enableIf: "{% if node.override.create.enabled %} false {% else %} true {% endif %}"

          - displayName: Multi Source Strategy
            attributeName: insertStrategy
            type: dropdownSelector
            default: UNION ALL
            options:
            - "UNION"
            - "UNION ALL"
            isRequired: false
            enableIf: "{% if node.isMultisource %} true {% else %} false {% endif %}"

          - type: businessKeyColumns
            isRequired: false
            enableIf: "{% if node.materializationType == 'view' %} false {% else %} true {% endif %}"

          - displayName: Truncate Before
            attributeName: truncateBefore
            type: toggleButton
            default: false
            enableIf: "{% if node.materializationType == 'view' %} false {% else %} true {% endif %}"

          - displayName: Enable Tests
            attributeName: testsEnabled
            type: toggleButton
            default: false
            enableIf: "{% if node.materializationType == 'view' %} false {% else %} true {% endif %}"
            
          - displayName: Distinct
            attributeName: selectDistinct
            type: toggleButton
            default: false
            enableIf: "{% if config.groupByAll or  node.override.create.enabled %} %} false {% else %} true {% endif %}"

          - displayName: Pre-SQL
            attributeName: preSQL
            type: textBox
            syntax: sql
            isRequired: false
            enableIf: "{% if node.materializationType == 'view' %} false {% else %} true {% endif %}"

          - displayName: Post-SQL
            attributeName: postSQL
            type: textBox
            syntax: sql
            isRequired: false
            enableIf: "{% if node.materializationType == 'view' %} false {% else %} true {% endif %}"

        systemColumns:
        - displayName: SYSTEM_CREATE_DATE
          transform: CAST(GETDATE() AS DATETIME2(3))
          dataType: DATETIME2(3)
          placement: end
          attributeName: isSystemCreateDate

        - displayName: SYSTEM_UPDATE_DATE
          transform: CAST(GETDATE() AS DATETIME2(3))
          dataType: DATETIME2(3)
          placement: end
          attributeName: isSystemUpdateDate
      templates:
        create:
          templateString: |-
            {#
                Copyright (c) 2023 Coalesce. All rights reserved.
            This script and its associated documentation are confidential and proprietary to Coalesce.
            Unauthorized reproduction, distribution, or disclosure of this material is strictly prohibited.
            Coalesce permits you to copy and modify this script for the purposes of using with Coalsce but
            does not permit copying or modification for any other purpose.  
            #}
            {# == Node Type Version        : 1  == #}
            {# == Node Type Name           : Fact  == #}
            {# == Node Type Description    :This node loads data into fact table using config options distinct,multi-source  == #}

            {% if node.override.create.enabled %}
            	
            	{{ node.override.create.script }}

            {% elif node.materializationType == 'table' %}

              {{ stage('Drop Fact Table') }}
              DROP TABLE IF EXISTS {{ ref_no_link(node.location.name, node.name) }}

              {{ stage('Create Fact Table') }}

            	CREATE TABLE {{ ref_no_link(node.location.name, node.name) }}
            	(
            		{% for col in columns %}
                         [{{ col.name }}] {{ col.dataType }}
            			{%- if not col.nullable %} NOT NULL
            			{% endif %}
            			{%- if not loop.last -%}, {% endif %}
            		{% endfor %}
            	)
                
            {% elif node.materializationType == 'view' %}
                {{ stage('Drop Fact View') }}

                DROP VIEW IF EXISTS {{ ref_no_link(node.location.name, node.name) }}


                {{ stage('Create Fact View') }}

                CREATE VIEW {{ ref_no_link(node.location.name, node.name) }}
                (
                    {% for col in columns %}
                        [{{ col.name }}]
                        {%- if not loop.last -%}, {% endif %}
                    {% endfor %}
                )
                AS
                {% for source in sources %}
                    SELECT
                    {% for col in source.columns %}
                        {{ get_source_transform(col) }} AS [{{ col.name }}]
                        {%- if not loop.last -%}, {% endif %}
                    {% endfor %}

                    {{ source.join }}

                    {% if not loop.last %}
                        {% if config.insertStrategy in ['UNION', 'UNION ALL'] %}
                            {{ config.insertStrategy }}
                        {% else %}
                            UNION
                        {% endif %}
                    {% endif %}
                {% endfor %}

            {% endif %}
        run:
          templateString: |-
            {#
                Copyright (c) 2023 Coalesce. All rights reserved.
            This script and its associated documentation are confidential and proprietary to Coalesce.
            Unauthorized reproduction, distribution, or disclosure of this material is strictly prohibited.
            Coalesce permits you to copy and modify this script for the purposes of using with Coalsce but
            does not permit copying or modification for any other purpose.  
            #}
            {# == Node Type Version        : 1  == #}
            {# == Node Type Name           : Fact  == #}
            {# == Node Type Description    :This node loads data into fact table using config options distinct,multi-source  == #}

            {# == Check if business key is specified  == #}

            {% set has_business_key = columns | selectattr("isBusinessKey") | list | length > 0 %}

            {# == Variable check to identify type of dimension == #}

            {% set is_type_2 = columns | selectattr("isChangeTracking") | list | length > 0 %}

            {# == To run data quality tests before data insertion == #}

                {% for test in node.tests if config.testsEnabled %}
                    {% if test.runOrder == 'Before' %}
                        {{ test_stage(test.name, test.continueOnFailure) }}
                        {{ test.templateString }}
                    {% endif %}
                {% endfor %}

            {% if node.materializationType == 'table' %}

            {# == Queries to be excuted before data insertion  == #}

            	{% if config.preSQL %}
            		{{ stage('Pre-SQL') }}
            		{{ config.preSQL }}
            	{% endif %}

             {# == Truncate data before data insertion  == #}

                {% if config.truncateBefore %}
                    {{ stage('Truncate Fact Table') }}
                    TRUNCATE TABLE {{ ref_no_link(node.location.name, node.name) }}
                {% endif %}
            	
                 {# == Check if business key is specified  == #}    
                    
                    {% if has_business_key %}

                    {# == Executed if business key is specified  == #}
                        
            		{{ stage('Update Existing Records') }}
                       
                    UPDATE TGT SET 
            		 {% for col in columns if not (  col.isBusinessKey or
                                                                col.isSystemCreateDate) -%}
                                [TGT].[{{col.name}}] = [SRC].[{{col.name}}]
                            {% if not loop.last %}, {% endif %}
                    {%- endfor -%}
            		FROM {{ ref_no_link(node.location.name, node.name) }} TGT
            		INNER JOIN (
                    {%- for source in sources %}
                            (SELECT
                            {%- if config.selectDistinct %}
                            DISTINCT
                            {%- endif %}
                            {%- for col in source.columns if not col.isSurrogateKey %}
                                {%- if col.isSystemVersion %}
                                	1
                                {%- elif col.isSystemCurrentFlag %}
                                	'Y'
                                {%- else %}
                                    {{ get_source_transform(col) }}
                                {%- endif %}
                                AS [{{col.name}}]
                                {%- if not loop.last %}, {% endif %}
                            {%- endfor %}
                            {{ source.join }})     
                             {%- if config.insertStrategy in ['UNION', 'UNION ALL'] and not loop.last %}
                                 {{config.insertStrategy}}
                             {%- endif %}
                    {% endfor %})AS SRC 
            		ON 
            		{% for col in columns if col.isBusinessKey -%}
                            {% if not loop.first %}
                                AND
                            {% endif %}
                            [SRC].[{{col.name}}]= [TGT].[{{col.name}}]
                    {% endfor %}
            		WHERE 
            		{%- for col in columns if not (   col.isBusinessKey or
                                                                col.isSurrogateKey or
                                                                col.isSystemVersion or
                                                                col.isSystemCurrentFlag or
                                                                col.isSystemStartDate or
                                                                col.isSystemEndDate or
                                                                col.isSystemUpdateDate or
                                                                col.isSystemCreateDate) -%}
                            {%- if loop.first -%}
                                (
                            {%- else %}
                                OR
                            {%- endif %}
                            ISNULL( CAST([SRC].[{{col.name}}] as NVARCHAR(MAX)), '**NULL**') <> ISNULL( CAST([TGT].[{{col.name}}] as NVARCHAR(MAX)), '**NULL**')
                            {% if loop.last -%}
                                )
                            {%- endif -%}
                   {% endfor %}

            	{{ stage('Insert New Records' ) }}  
                 
            	INSERT INTO  {{ ref_no_link(node.location.name, node.name) }} 
                (
                   {%- for col in columns %}
                         [{{ col.name }}] 
            			{%- if not loop.last %}, {% endif %}
            		{%- endfor -%} 
                )
                  SELECT 
                    {%- for col in columns  -%}
                     {%-if not col.isSurrogateKey%}
                         [SRC].[{{ col.name }}] 
                      {%-else%}
                          ROW_NUMBER() OVER (ORDER BY ({%- for col in columns if col.isBusinessKey -%}{%- if not loop.first %} , {%- endif %} [SRC].[{{col.name}}] {%endfor%})) 
            	          + COALESCE (( SELECT MAX({%- for col in columns if col.isSurrogateKey -%}{%- if not loop.first %} , {%- endif %} [{{col.name}}] {%endfor%}) FROM {{ ref_no_link(node.location.name, node.name) }}),0) AS [{{ col.name }}] 
                      {%-endif%}
            			{%- if not loop.last -%}, {% endif %}
            		{%- endfor %} FROM
            	       ( {%- for source in sources %}
                            SELECT
                            {%- if config.selectDistinct %}
                            DISTINCT
                            {%- endif %}
                            {%- for col in source.columns if not col.isSurrogateKey %}
                                {%- if col.isSystemVersion %}
                                	1
                                {%- elif col.isSystemCurrentFlag %}
                                	'Y'
                                {%- else %}
                                    {{ get_source_transform(col) }}
                                {%- endif %}
                                AS [{{col.name}}]
                                {%- if not loop.last %}, {% endif %}
                            {%- endfor %}
                            {{ source.join }} 
                             {%- if config.insertStrategy in ['UNION', 'UNION ALL'] and not loop.last %}
                                 {{config.insertStrategy}}
                             {%- endif %}
                    {% endfor %})AS [SRC]
            		LEFT JOIN {{ ref_no_link(node.location.name, node.name) }} AS [TGT]
            		ON 
            		{%- for col in columns if col.isBusinessKey -%}
                            {% if not loop.first %}
                                AND
                            {% endif %}
                            [SRC].[{{col.name}}]= [TGT].[{{col.name}}]
                    {%- endfor -%}
            		WHERE 
            		{% for col in columns if col.isBusinessKey -%}
                            {% if not loop.first %}
                                AND
                            {% endif %}
                            [TGT].[{{col.name}}] IS NULL
                    {% endfor -%}

                    {% else %}

                {# == Executed if business key is not specified  == #}

                        {{ stage('Insert new records' | string ) }}
                        INSERT INTO {{ ref_no_link(node.location.name, node.name) }}
                        (
                            {% for col in columns if not col.isSurrogateKey %}
                                "{{ col.name }}"
                                {%- if not loop.last -%},{% endif %}
                            {% endfor %}
                        )
                       {%- for source in sources %}
                        (SELECT
                        {%- if config.selectDistinct %}
                        DISTINCT
                        {%- endif %}
                        {%- for col in source.columns if not col.isSurrogateKey %}

                            {%- if col.isSystemVersion %}
                                1
                            {%- elif col.isSystemCurrentFlag %}
                                'Y'
                            {%- else %}
                                {{ get_source_transform(col) }}
                            {%- endif %}
                            AS [{{ col.name }}]
                            {%- if not loop.last -%}, {% endif %}             
                        {%- endfor %}
                        {{ source.join }} ) 
                        {%- if config.insertStrategy in ['UNION', 'UNION ALL'] and not loop.last %}
                            {{config.insertStrategy}}
                        {%- endif %}
                    {%- endfor %} 
                    
                    {% endif %}

            {# == Queries to be excuted post data insertion  == #}
            	
            	{% if config.postSQL %}
            		{{ stage('Post-SQL') }}
            		{{ config.postSQL }}
            	{% endif %}
            	
            {% endif %}

             {# == To run data quality tests after data insertion == #}

            {% if config.testsEnabled %}
            	{% for test in node.tests %}
            		{% if test.runOrder == 'After' %}
            			{{ test_stage(test.name, test.continueOnFailure) }}
            			{{ test.templateString }}
                    {% endif %}
            	{% endfor %}

            	{% for column in columns %}
            		{% for test in column.tests %}
            			{{ test_stage(column.name + ": " + test.name) }}
            			{{ test.templateString }}
            		{% endfor %}
            	{% endfor %}
            {% endif %}
    name: Copy of Fact
    version: 1
